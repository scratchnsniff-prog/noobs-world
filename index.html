<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Iron Café</title>
  <style>
    :root {
      --night: #040b1e;
      --panel: rgba(7, 11, 28, 0.8);
      --neon: #d9ec1a;
      --neon-soft: rgba(217, 236, 26, 0.38);
      --red: #ff3350;
      --ink: #edf3ff;
      --muted: #99a6d8;
      --sw: 211.2px;
      --sh: 240px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--night);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #app {
      position: relative;
      width: min(100vw, 1000px);
      height: min(100vh, 588px);
    }

    #world {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background-color: #0a1230;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: filter 0.25s ease, background-image 0.25s ease;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 28px 60px rgba(0,0,0,0.35);
    }

    #roomTint, #rainTint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #roomTint {
      background: rgba(7, 12, 24, 0.10);
    }

    #rainTint {
      background:
        linear-gradient(rgba(128, 149, 184, 0.16), rgba(128, 149, 184, 0.12)),
        repeating-linear-gradient(
          to bottom,
          rgba(180, 210, 255, 0.15) 0,
          rgba(180, 210, 255, 0.15) 2px,
          rgba(0,0,0,0) 2px,
          rgba(0,0,0,0) 9px
        );
    }

    .player {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      transform: translate(-50%, -100%);
      z-index: 3;
    }

    .sprite {
      position: absolute;
      left: 0;
      top: 0;
      width: 120px;
      height: 160px;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    }

    .noob {
      position: relative;
      width: 100%;
      height: 100%;
      animation: bob 1.4s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 44px;
      height: 44px;
      transform: translateX(-50%);
      background: #f8d5b5;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.18);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06);
    }

    .head::before,
    .head::after {
      content: "";
      position: absolute;
      top: 18px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #2c2b2f;
    }

    .head::before { left: 12px; }
    .head::after { right: 12px; }

    .body {
      position: absolute;
      left: 50%;
      top: 42px;
      width: 64px;
      height: 62px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #e6f0ff 0%, #bfd3ff 100%);
      border-radius: 18px 18px 12px 12px;
      border: 3px solid rgba(0,0,0,0.12);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.04);
    }

    .arm {
      position: absolute;
      top: 50px;
      width: 18px;
      height: 52px;
      background: #f8d5b5;
      border-radius: 12px;
      border: 3px solid rgba(0,0,0,0.12);
    }

    .arm.left { left: 12px; transform: rotate(18deg); }
    .arm.right { right: 12px; transform: rotate(-18deg); }

    .leg {
      position: absolute;
      bottom: 0;
      width: 20px;
      height: 46px;
      background: #7b8cc8;
      border-radius: 10px;
      border: 3px solid rgba(0,0,0,0.12);
    }

    .leg.left { left: 38px; }
    .leg.right { right: 38px; }

    .badge {
      position: absolute;
      left: 50%;
      top: 58px;
      width: 18px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 12px rgba(217, 236, 26, 0.8);
    }

    #ui {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    #roomName {
      background: rgba(6, 10, 22, 0.7);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 8px 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    #hint {
      background: rgba(7, 11, 28, 0.56);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      backdrop-filter: blur(5px);
    }

    @media (max-width: 760px) {
      #app {
        width: 100vw;
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="world">
      <div id="roomTint"></div>
      <div id="rainTint"></div>
      <div id="player" class="player" aria-label="player">
        <div class="sprite">
          <div class="noob">
            <div class="head"></div>
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="body"></div>
            <div class="badge"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="ui">
      <div id="roomName">Iron Café</div>
      <div id="hint">Move: WASD / Arrow Keys • Jump: Space • Rain: R</div>
    </div>
  </div>

  <audio id="musicAudio" loop preload="auto"></audio>
  <audio id="rainAudio" loop preload="auto"></audio>

  <script>
    const world = document.getElementById('world');
    const roomName = document.getElementById('roomName');
    const roomTint = document.getElementById('roomTint');
    const rainTint = document.getElementById('rainTint');
    const playerEl = document.getElementById('player');
    const musicAudio = document.getElementById('musicAudio');
    const rainAudio = document.getElementById('rainAudio');

    const musicUrl = 'https://www.image2url.com/r2/default/audio/1793599952198-fcb61cd8-fbbf-498f-bd86-b82b4f0e3092.mp3';
    const rainUrl = 'https://www.image2url.com/r2/default/audio/1793599923817-73f7b374-67a7-4c6c-9711-a8257c610173.mp3';

    const rooms = {
      ironCafe: {
        name: 'Iron Café',
        bg: 'background.webp',
        music: false,
        rain: false,
        left: null,
        right: 'exterior',
        floor: 518,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      },
      exterior: {
        name: 'Exterior',
        bg: 'https://i.postimg.cc/0Qng22bj/Exterior.jpg',
        music: false,
        rain: true,
        left: 'ironCafe',
        right: 'stairway',
        floor: 518,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      },
      stairway: {
        name: 'Stairway',
        bg: 'https://i.postimg.cc/PxyGrrPt/Stairway.jpg',
        music: false,
        rain: true,
        left: 'exterior',
        right: 'disco',
        floor: 518,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      },
      disco: {
        name: 'Disco / Dance Room',
        bg: 'https://i.postimg.cc/DZ6Vyy8b/Disco-room.gif',
        music: true,
        rain: false,
        left: 'stairway',
        right: 'dining',
        floor: 520,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      },
      dining: {
        name: 'Dining Area',
        bg: 'https://i.postimg.cc/LXDd66nn/Dining-area.jpg',
        music: true,
        rain: false,
        left: 'disco',
        right: 'restroom',
        floor: 520,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      },
      restroom: {
        name: 'Restroom',
        bg: 'https://i.postimg.cc/fLC4TTJL/Restrooms.jpg',
        music: true,
        rain: false,
        left: 'dining',
        right: 'ironCafe',
        floor: 520,
        xMin: 20,
        xMax: 980,
        exitLeft: 0,
        exitRight: 960,
      }
    };

    const state = {
      room: 'ironCafe',
      x: 200,
      y: 522,
      vx: 0,
      vy: 0,
      jump: 0,
      raining: false,
      moving: false
    };

    const keys = {};

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setRoom(nextRoom) {
      const room = rooms[nextRoom];
      if (!room) return;
      state.room = nextRoom;
      roomName.textContent = room.name;
      world.style.backgroundImage = `url("${room.bg}")`;
      roomTint.style.opacity = room.music ? '0.18' : '0.1';

      if (room.rain && state.raining) {
        rainTint.style.opacity = '1';
        world.style.filter = 'brightness(0.88) saturate(0.9)';
      } else {
        rainTint.style.opacity = '0';
        world.style.filter = 'none';
      }

      if (room.music) {
        musicAudio.src = musicUrl;
        musicAudio.volume = 0.45;
        musicAudio.play().catch(() => {});
      } else {
        musicAudio.pause();
      }

      if ((state.room === 'exterior' || state.room === 'stairway') && state.raining) {
        rainAudio.src = rainUrl;
        rainAudio.volume = 0.55;
        rainAudio.play().catch(() => {});
      } else {
        rainAudio.pause();
      }
    }

    function toggleRain() {
      const room = rooms[state.room];
      if (!room || (state.room !== 'exterior' && state.room !== 'stairway')) return;
      state.raining = !state.raining;
      if (state.raining) {
        rainAudio.src = rainUrl;
        rainAudio.volume = 0.55;
        rainAudio.play().catch(() => {});
        rainTint.style.opacity = '1';
        world.style.filter = 'brightness(0.88) saturate(0.9)';
      } else {
        rainAudio.pause();
        rainTint.style.opacity = '0';
        world.style.filter = 'none';
      }
    }

    function updatePlayer() {
      const room = rooms[state.room];
      const moveX = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
      const moveY = (keys.ArrowUp || keys.w || keys[' ']) ? -1 : 0;

      if (moveX !== 0) {
        state.vx = moveX * 4.2;
      } else {
        state.vx *= 0.76;
      }

      if (moveY !== 0 && state.jump === 0) {
        state.jump = 1;
        state.vy = -12.5;
      }

      if (state.jump > 0 || state.vy !== 0) {
        state.vy += 0.65;
        state.y += state.vy;
        if (state.y >= room.floor) {
          state.y = room.floor;
          state.vy = 0;
          state.jump = 0;
        }
      }

      state.x += state.vx;
      state.x = clamp(state.x, room.xMin, room.xMax);

      if (state.x <= room.xMin && rooms[state.room].left) {
        const target = rooms[state.room].left;
        state.x = 960;
        setRoom(target);
      }

      if (state.x >= room.xMax && rooms[state.room].right) {
        const target = rooms[state.room].right;
        state.x = 30;
        setRoom(target);
      }

      playerEl.style.left = `${state.x}px`;
      playerEl.style.top = `${state.y}px`;
      const dir = state.vx < 0 ? -1 : 1;
      playerEl.style.transform = `scaleX(${dir}) scaleY(1)`;
      playerEl.style.filter = state.jump > 0 ? 'brightness(1.1)' : 'none';
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'a', 'd', 'w', 's', 'r'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }

      if (event.key === 'ArrowLeft' || key === 'a') keys.ArrowLeft = true; keys.a = true;
      if (event.key === 'ArrowRight' || key === 'd') keys.ArrowRight = true; keys.d = true;
      if (event.key === 'ArrowUp' || key === 'w') keys.ArrowUp = true; keys.w = true;
      if (event.key === ' ' || key === 'spacebar') keys[' '] = true;
      if (key === 'r') toggleRain();
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (event.key === 'ArrowLeft' || key === 'a') { keys.ArrowLeft = false; keys.a = false; }
      if (event.key === 'ArrowRight' || key === 'd') { keys.ArrowRight = false; keys.d = false; }
      if (event.key === 'ArrowUp' || key === 'w') { keys.ArrowUp = false; keys.w = false; }
      if (event.key === ' ' || key === 'spacebar') keys[' '] = false;
    });

    document.body.addEventListener('pointerdown', () => {
      if (!musicAudio.src && !rainAudio.src) {
        musicAudio.src = musicUrl;
        rainAudio.src = rainUrl;
      }
      if (rooms[state.room].music) {
        musicAudio.play().catch(() => {});
      }
      if ((state.room === 'exterior' || state.room === 'stairway') && state.raining) {
        rainAudio.play().catch(() => {});
      }
    }, { once: true });

    setRoom(state.room);
    updatePlayer();
    setInterval(() => {
      updatePlayer();
    }, 1000 / 60);
  </script>
</body>
</html>
